<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a3128">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Planner">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11.5h13V9"/><path d="M10 20.5v-6h4v6"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12.2 2.8 2.8L16 9.5"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 20.5c-3.9 0-6.5-2.6-6.5-6.2 0-3 2-4.8 3.3-6.8.3 1.6 1.2 2.7 2.4 3.3.2-3 1.6-5.4 3.8-7.3-.3 2.9 1 4.8 2.4 6.5 1 1.2 1.6 2.7 1.6 4.3 0 3.6-3 6.2-7 6.2Z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.5a2 2 0 0 1 2-2h12v14.5H7a2 2 0 0 0-2 2v-14.5Z"/><path d="M5 19.5a2 2 0 0 0 2 2h12V18"/><path d="M9 7.5h6"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7.5h9M17 7.5h3M4 16.5h3M11 16.5h9"/><circle cx="15" cy="7.5" r="2"/><circle cx="9" cy="16.5" r="2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4.5 11V9.5a3 3 0 0 1 3-3h12"/><path d="m16.5 3.5 3 3-3 3"/><path d="M19.5 13v1.5a3 3 0 0 1-3 3h-12"/><path d="m7.5 20.5-3-3 3-3"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15L6 16.5Z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15L6 16.5Z"/><path d="M10 20.5a2 2 0 0 0 4 0"/><path d="M4 4l16 16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4 4 9-9.5"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7.5 16v-5M12 16V7.5M16.5 16v-8"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5v-11"/><path d="m7.5 9 4.5-4.5L16.5 9"/><path d="M5 20h14"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.5 3.4 5.3 3.4 8.5s-1 6-3.4 8.5c-2.4-2.5-3.4-5.3-3.4-8.5s1-6 3.4-8.5Z"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.8 11a3.75 3.75 0 0 1-.3 7.5H7Z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5 3 19.5h18L12 4.5Z"/><path d="M12 10v4M12 17v.01"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 10v3.5l2 1.5M9.5 3h5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M10 7h10M10 12h10M10 17h10"/><path d="M4.5 7h1.5M4.5 12h1.5M4.5 17h1.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12V4.5a1 1 0 0 1 1-1H12l8.5 8.5-8 8L3.5 12Z"/><circle cx="8" cy="8" r="1.2"/></symbol>
</svg>

<header>
  <h1 onclick="showView('dash')" style="cursor:pointer;">MY PLANNER</h1>
  <nav>
    <button data-view="dash" class="active"><span class="nav-ic" aria-hidden="true"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg></span><span data-i18n="nav_home"></span></button>
    <button data-view="tasks"><span class="nav-ic" aria-hidden="true"><svg class="ic" aria-hidden="true"><use href="#i-tasks"/></svg></span><span data-i18n="nav_tasks"></span></button>
    <button data-view="cal"><span class="nav-ic" aria-hidden="true"><svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg></span><span data-i18n="nav_cal"></span></button>
    <button data-view="habits"><span class="nav-ic" aria-hidden="true"><svg class="ic" aria-hidden="true"><use href="#i-flame"/></svg></span><span data-i18n="nav_habits"></span></button>
    <button data-view="diary"><span class="nav-ic" aria-hidden="true"><svg class="ic" aria-hidden="true"><use href="#i-book"/></svg></span><span data-i18n="nav_diary"></span></button>
  </nav>
  <button class="icon-btn" id="btn-settings" onclick="showView('settings')" data-i18n-aria="settings"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg></button>
</header>

<main>

  <!-- Dashboard -->
  <section id="view-dash" class="view active">
    <div class="dash-head">
      <div class="dash-date" id="dash-date"></div>
      <div class="dash-sum" id="dash-sum"></div>
    </div>
    <section class="hero" id="dash-hero" aria-live="polite"></section>
    <div class="card" id="dash-habits-card">
      <h2 data-i18n="today_habits"></h2>
      <div class="habit-chips" id="dash-habits"></div>
    </div>
    <div class="card">
      <h2 data-i18n="nav_tasks_short"></h2>
      <div id="dash-buckets"></div>
    </div>
    <div class="card">
      <h2 data-i18n="week_events"></h2>
      <div id="dash-events" class="tappable"></div>
      <div class="card-actions">
        <button class="ghost" id="btn-later" onclick="toggleLater()"></button>
      </div>
      <div id="dash-events-later" class="tappable" style="display:none;"></div>
    </div>
    <div class="page-actions">
      <button class="ghost" onclick="showView('stats')"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg><span data-i18n="open_stats"></span></button>
    </div>
  </section>

  <!-- Settings -->
  <section id="view-settings" class="view">
    <div class="page-back">
      <button class="ghost" onclick="showView('dash')"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg><span data-i18n="back_home"></span></button>
    </div>
    <div class="card">
      <h2 data-i18n="settings"></h2>
      <div class="set-group">
        <button class="chip-btn" id="btn-notif" onclick="toggleNotif()"></button>
        <button class="chip-btn" onclick="toggleLang()" id="btn-lang"></button>
      </div>
      <div class="set-group" id="notif-offsets"></div>
      <div class="set-group" id="sound-chips"></div>
      <div class="set-group" id="theme-chips"></div>
    </div>
    <div class="card">
      <h2 data-i18n="data_title"></h2>
      <div class="set-group">
        <button class="chip-btn" onclick="exportData()"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="export"></span></button>
        <button class="chip-btn" onclick="document.getElementById('import-file').click()"><svg class="ic" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="import"></span></button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)">
      </div>
      <div class="set-group">
        <button class="chip-btn" onclick="exportICS()"><svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg><span data-i18n="ics_export"></span></button>
        <button class="chip-btn" onclick="document.getElementById('ics-file').click()"><svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg><span data-i18n="ics_import"></span></button>
        <input type="file" id="ics-file" accept=".ics" style="display:none" onchange="importICS(this)">
      </div>
      <div class="set-group" id="sync-area"></div>
    </div>
  </section>

  <!-- Tasks -->
  <section id="view-tasks" class="view">
    <div class="card">
      <h2 data-i18n="add_task"></h2>
      <div class="task-form">
        <input type="text" id="task-title" data-i18n-ph="task_name_ph" onkeydown="if(event.key==='Enter')addTask()">
      </div>
      <div class="due-row">
        <div class="due-chips" id="task-due-chips"></div>
        <input type="hidden" id="task-due">
      </div>
      <details class="more" id="task-more">
        <summary data-i18n="more_opts"></summary>
        <div class="task-form">
          <input type="text" id="task-tag" data-i18n-ph="tag_ph" class="input-tag">
          <span class="time-range">
            <input type="time" id="task-time" aria-label="start">
            <span>–</span>
            <input type="time" id="task-time-end" aria-label="end">
          </span>
          <select id="task-pri">
            <option value="mid" data-i18n="priority_mid"></option>
            <option value="high" data-i18n="priority_high"></option>
            <option value="low" data-i18n="priority_low"></option>
          </select>
          <label class="notify-label"><input type="checkbox" id="task-notify" checked><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg><span data-i18n="notify_this"></span></label>
          <input type="time" id="task-notify-at" class="input-sm" aria-label="notify at">
        </div>
        <p class="hint" data-i18n="notify_at_hint"></p>
      </details>
      <div class="form-actions">
        <button class="primary" id="btn-task-add" onclick="addTask()"></button>
        <button class="ghost" id="btn-task-cancel" onclick="cancelTaskEdit()" style="display:none;"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="open_tasks"></h2>
      <div class="filter-bar">
        <input type="text" id="task-search" data-i18n-ph="search_ph" oninput="renderTasks()">
        <select id="task-tag-filter" onchange="renderTasks()"></select>
      </div>
      <div id="task-list-open"></div>
    </div>
    <div class="card">
      <h2 data-i18n="done_tasks"></h2>
      <div id="task-list-done"></div>
    </div>
    <div class="card">
      <h2 data-i18n="add_goal"></h2>
      <div class="task-form">
        <input type="text" id="proj-name" data-i18n-ph="goal_ph" onkeydown="if(event.key==='Enter')addProj()">
        <button class="primary" onclick="addProj()" data-i18n="add"></button>
      </div>
      <p class="hint" data-i18n="goal_hint"></p>
    </div>
    <div class="card">
      <h2 data-i18n="goals"></h2>
      <div id="proj-list"></div>
    </div>
  </section>

  <!-- Calendar -->
  <section id="view-cal" class="view">
    <div class="card">
      <div class="cal-header">
        <button class="icon-btn" onclick="calMove(-1)" aria-label="Previous month"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
        <h2 id="cal-title"></h2>
        <span class="row-gap">
          <button class="chip-btn" onclick="calToday()" data-i18n="today_word"></button>
          <button class="icon-btn" onclick="calMove(1)" aria-label="Next month"><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
        </span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </section>

  <!-- Habits -->
  <section id="view-habits" class="view">
    <div class="card pomo-card">
      <div>
        <div class="pomo-mode" id="pomo-mode"></div>
        <div class="pomo-time" id="pomo-time">25:00</div>
      </div>
      <div class="pomo-btns">
        <button class="primary" id="pomo-toggle" onclick="pomoToggle()"></button>
        <button class="ghost" onclick="pomoReset()" data-i18n="reset"></button>
      </div>
      <span class="time-range">
        <input type="number" id="pomo-work-min" min="1" max="180" class="input-num" onchange="setPomoCfg()">
        <span>/</span>
        <input type="number" id="pomo-break-min" min="1" max="60" class="input-num" onchange="setPomoCfg()">
        <span data-i18n="pomo_min"></span>
      </span>
      <div class="pomo-count" id="pomo-count"></div>
    </div>
    <div class="card">
      <h2 data-i18n="add_habit"></h2>
      <div class="task-form">
        <input type="text" id="habit-name" data-i18n-ph="habit_ph" onkeydown="if(event.key==='Enter')addHabit()">
        <span class="time-range"><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg><input type="time" id="habit-remind" aria-label="reminder"></span>
        <button class="primary" onclick="addHabit()" data-i18n="add"></button>
      </div>
      <p class="hint" data-i18n="habit_hint"></p>
    </div>
    <div class="card">
      <div class="cal-header">
        <h2 data-i18n="habits"></h2>
        <span class="row-gap">
          <button class="icon-btn" onclick="habitMove(1)" aria-label="Previous week"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
          <span class="settings-label" id="habit-range-label"></span>
          <button class="icon-btn" onclick="habitMove(-1)" aria-label="Next week"><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
          <button class="chip-btn" onclick="habitMove(0)" data-i18n="today_word"></button>
        </span>
      </div>
      <div id="habit-list"></div>
    </div>
  </section>

  <!-- Diary -->
  <section id="view-diary" class="view">
    <div class="card">
      <div class="cal-header">
        <button class="icon-btn" onclick="dCalMove(-1)" aria-label="Previous month"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
        <h2 id="dcal-title"></h2>
        <span class="row-gap">
          <button class="chip-btn" onclick="dCalToday()" data-i18n="today_word"></button>
          <button class="icon-btn" onclick="dCalMove(1)" aria-label="Next month"><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
        </span>
      </div>
      <div class="cal-grid" id="dcal-grid"></div>
    </div>
    <div class="card" id="diary-editor">
      <h2 id="diary-editor-title"></h2>
      <div class="mood-picker" id="mood-picker"></div>
      <textarea id="diary-text" rows="6" data-i18n-ph="entry_ph"></textarea>
      <div class="form-actions split">
        <button class="ghost" id="btn-diary-del" onclick="delDiary(selectedDiaryDate)" data-i18n="del_label"></button>
        <span class="row-gap">
          <span class="saved-note" id="diary-saved"></span>
          <button class="primary" onclick="saveDiary()" data-i18n="save"></button>
        </span>
      </div>
    </div>
  </section>

  <!-- Stats -->
  <section id="view-stats" class="view">
    <div class="page-back">
      <button class="ghost" onclick="showView('dash')"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg><span data-i18n="back_home"></span></button>
    </div>
    <div class="dash-grid">
      <div class="card">
        <div class="stat" id="st-rate">–</div>
        <div class="stat-label" data-i18n="stats_rate"></div>
      </div>
      <div class="card">
        <div class="stat" id="st-pomo-total">0</div>
        <div class="stat-label" data-i18n="stats_pomo_total"></div>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="stats_done"></h2>
      <div class="chart-bars" id="st-done"></div>
    </div>
    <div class="card">
      <h2 data-i18n="stats_pomo"></h2>
      <div class="chart-bars" id="st-pomo"></div>
    </div>
    <div class="card">
      <h2 data-i18n="stats_pri"></h2>
      <div id="st-pri"></div>
    </div>
    <div class="card">
      <h2 data-i18n="stats_mood"></h2>
      <div class="mood-week" id="st-mood"></div>
    </div>
    <div class="card">
      <div class="cal-header">
        <h2 data-i18n="stats_habits"></h2>
        <span id="st-habit-range" class="row-gap"></span>
      </div>
      <div class="range-label" id="st-habit-label"></div>
      <div id="st-habits"></div>
    </div>
  </section>

</main>

<!-- Day modal -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-date"></h3>
      <button class="icon-btn modal-x" onclick="closeModal()" data-i18n-aria="close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-events" id="modal-events"></div>
    <div class="row">
      <input type="text" id="event-title" data-i18n-ph="event_ph" onkeydown="if(event.key==='Enter')addEvent()">
    </div>
    <div class="row">
      <span class="time-range">
        <input type="time" id="event-time">
        <span>–</span>
        <input type="time" id="event-time-end">
      </span>
      <span class="color-swatches" id="event-colors"></span>
    </div>
    <div class="row" id="row-repeat">
      <select id="event-repeat" onchange="updateRepeatUI()" aria-label="repeat">
        <option value="" data-i18n="repeat_none"></option>
        <option value="daily" data-i18n="repeat_daily"></option>
        <option value="weekly" data-i18n="repeat_weekly_opt"></option>
        <option value="monthly" data-i18n="repeat_monthly"></option>
      </select>
      <label class="repeat-label" id="row-until"><span data-i18n="repeat_until"></span><input type="date" id="event-until" class="input-sm"></label>
    </div>
    <div class="row">
      <label class="repeat-label"><input type="checkbox" id="event-notify" checked><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg><span data-i18n="notify_this"></span></label>
      <input type="time" id="event-notify-at" class="input-sm">
    </div>
    <button class="primary" id="btn-event-add" onclick="addEvent()"></button>
    <button class="ghost" id="btn-event-cancel" onclick="cancelEventEdit()" style="display:none;"></button>
    <div class="modal-close"><button class="ghost" onclick="closeModal()" data-i18n="close"></button></div>
  </div>
</div>

<!-- Task sheet: view / edit one task without leaving the current screen -->
<div class="modal-bg sheet-bg" id="task-sheet-bg" onclick="if(event.target===this)closeTaskSheet()">
  <div class="modal sheet" role="dialog" aria-modal="true" aria-labelledby="ts-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="modal-head">
      <button class="ts-done-btn" id="ts-done" onclick="sheetToggleDone()"></button>
      <button class="icon-btn modal-x" onclick="closeTaskSheet()" data-i18n-aria="close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <textarea id="ts-title" class="ts-title" rows="1" maxlength="200" data-i18n-aria="task_name_ph"></textarea>
    <div class="due-chips" id="ts-due-chips"></div>
    <input type="hidden" id="ts-due">
    <div id="ts-subs" class="ts-subs"></div>
    <div class="sub-form" id="ts-sub-form" hidden>
      <input type="text" id="ts-sub-input" data-i18n-ph="sub_ph" onkeydown="if(event.key==='Enter')sheetAddSub()">
      <button class="ghost" onclick="sheetAddSub()" data-i18n="add"></button>
    </div>
    <button class="link-btn" id="ts-sub-open" onclick="openSheetSubForm()"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="add_sub"></span></button>
    <details class="more" id="ts-more">
      <summary id="ts-more-sum"></summary>
      <div class="task-form">
        <input type="text" id="ts-tag" data-i18n-ph="tag_ph" class="input-tag">
        <span class="time-range">
          <input type="time" id="ts-time" aria-label="start">
          <span>–</span>
          <input type="time" id="ts-time-end" aria-label="end">
        </span>
        <select id="ts-pri">
          <option value="mid" data-i18n="priority_mid"></option>
          <option value="high" data-i18n="priority_high"></option>
          <option value="low" data-i18n="priority_low"></option>
        </select>
        <label class="notify-label"><input type="checkbox" id="ts-notify"><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg><span data-i18n="notify_this"></span></label>
        <input type="time" id="ts-notify-at" class="input-sm" aria-label="notify at">
      </div>
    </details>
    <div class="form-actions split">
      <button class="link-btn danger" onclick="sheetDelete()" data-i18n="del_task"></button>
      <button class="primary" onclick="saveTaskSheet()" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- Undo toast -->
<div id="toast">
  <span id="toast-msg"></span>
  <button onclick="undoDelete()" data-i18n="undo"></button>
</div>

<script src="app.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>
